name: url_shortener_api
services:
  api:
    build: .
    env_file:
      - .env
    restart: on-failure
    volumes:
      - ./:/app
      - url_shortener_api_node_modules:/app/node_modules
      - url_shortener_api_build:/app/build
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    depends_on:
      - db
  db:
    image: mongo:latest
    attach: false
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - url_shortener_db_data:/data/db
  cache:
    image: redis:alpine
    restart: always
    # ports:
    #   - "6379:6379"
volumes:
  url_shortener_db_data:
  url_shortener_api_node_modules:
  url_shortener_api_build:
